---
- name: Inspect installed base packages
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - '-f=${Status}'
      - "{{ item }}"
  loop: "{{ common_packages }}"
  register: common_package_check
  changed_when: false
  failed_when: false

- name: Require previously installed base packages
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout == 'install ok installed'
    fail_msg: >-
      Paket {{ item.item }} belum terpasang.
      Jalankan prepare-packages.yml terlebih dahulu.
    quiet: true
  loop: "{{ common_package_check.results }}"
  loop_control:
    label: "{{ item.item }}"
- name: Create managed directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /opt/tunnel
    - /opt/tunnel-stage1
    - /usr/local/src
    - /etc/tunnel
    - /etc/systemd/journald.conf.d
- name: Create managed directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - /var/lib/tunnel
    - /var/lib/tunnel/exports
- name: Read current timezone
  ansible.builtin.command:
    argv: [timedatectl, show, -p, Timezone, --value]
  register: common_timezone_current
  changed_when: false
- name: Set local display timezone
  ansible.builtin.command:
    argv: [timedatectl, set-timezone, '{{ timezone }}']
  when: common_timezone_current.stdout | trim != timezone
  changed_when: true
- name: Enable chrony
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true
    daemon_reload: true
- name: Enable vnstat
  ansible.builtin.systemd:
    name: vnstat
    state: started
    enabled: true
    daemon_reload: true
- name: Configure journald.conf.j2
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf.d/99-tunnel.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart journald
- name: Read available congestion controls
  ansible.builtin.command:
    argv:
      - sysctl
      - -n
      - net.ipv4.tcp_available_congestion_control
  register: common_congestion
  changed_when: false
- name: Configure sysctl.conf.j2
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.d/99-tunnel.conf
    owner: root
    group: root
    mode: '0644'
  notify: Apply sysctl
- name: Configure tmpfiles.conf.j2
  ansible.builtin.template:
    src: tmpfiles.conf.j2
    dest: /etc/tmpfiles.d/tunnel.conf
    owner: root
    group: root
    mode: '0644'
- name: Create volatile lock directory
  ansible.builtin.file:
    path: /run/tunnel
    state: directory
    mode: '0700'
