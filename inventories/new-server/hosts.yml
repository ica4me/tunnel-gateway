---
# Inventory server baru (mode lokal: Ansible berjalan di server ini sendiri).
# Domain BOLEH dikosongkan: server memakai IP publik + sertifikat selfsigned,
# lalu domain & sertifikat Let's Encrypt diatur dari menu: Menu Sistem > 4.
all:
  hosts:
    gateway:
      ansible_host: 127.0.0.1
      ansible_connection: local
      ansible_user: root
      ansible_port: 22
      ansible_become: false            # sudah root; menghindari sudo-rs (Ubuntu 26.04)
      ansible_python_interpreter: /usr/bin/python3

      tunnel_domain: ""                # contoh: vpn.domainanda.com (kosong = mode IP)
      admin_email: ""                  # wajib saat memakai Let's Encrypt
      cert_mode: http01                # dipakai saat domain diisi; mode IP selalu selfsigned

      acme_enabled: true
      acme_ca: letsencrypt

      ssh_admin_port: 22               # port SSH admin yang SEDANG dipakai
      ssh_admin_extra_ports: []        # port SSH admin tambahan, mis. [2026]
      openssh_admin_change_access: false

      backup_enabled: false
      backup_age_recipient: ''
      backup_age_identity: "{{ vault_backup_age_identity | default('') }}"

      tunnelctl_enabled: true
      tunnelctl_integration_approved: true
      tunnelctl_fresh_install: true
      tunnelctl_accounts_imported: false
      tunnelctl_backup_integration_approved: true

      tunnelctl_settings:
        domain: "{{ tunnel_domain }}"
        cert_mode: "{{ cert_mode }}"
        timezone: Asia/Jakarta
        db_path: /var/lib/tunnel/tunnel.db
        lock_path: /run/tunnel/tunnel.lock
        settings_path: /etc/tunnel/settings.json
        xray_base_path: /etc/tunnel/xray/base.json
        xray_config_path: /etc/tunnel/xray/config.json
        xray_validate_cmd: [/usr/local/bin/xray, run, '-test', '-config']
        xray_api: 127.0.0.1:10085
        ssh_admin_port: "{{ ssh_admin_port }}"
        ssh_admin_extra_ports: "{{ ssh_admin_extra_ports }}"
        extra_http_ports: []
        doctor_services: [haproxy, xray, ws-epro, dropbear-tunnel, nginx, chrony, tunnel-firewall, vnstat]
        doctor_internal_ports: [143, 10015, 8080, 10010, 7300]
        doctor_required_checks: [services, db, ports, cert, time, configs]
        backup_dir: /var/backups/tunnel
        backup_keep: 7
        backup_age_recipients_file: /etc/tunnel/backup-age-recipients
        backup_age_identity: /etc/tunnel/backup-age-identity
        backup_include_certs: false
        ss_method: chacha20-ietf-poly1305
        defaults:
          days: 30
          trial_hours: 1
          quota_bytes: 30G
          ip_limit: 3
          lock_minutes: 15
        banner_path: /etc/tunnel/banner.txt
        wsepro_config_path: /etc/tunnel/ws-epro.conf
        cert_renew_cmd: [openssl, x509, '-checkend', '86400', '-noout', '-in', "/etc/haproxy/certs/{{ tunnel_domain }}.pem"]
