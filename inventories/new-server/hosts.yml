---
all:
  hosts:
    gateway_baru:
      ansible_host: 203.0.113.10
      ansible_user: root
      ansible_port: 22
      ansible_python_interpreter: /usr/bin/python3

      # WAJIB diisi sesuai server Anda
      tunnel_domain: gw.example.com
      admin_email: admin@example.com

      # selfsigned aman untuk LAN/private test.
      # http01/dns_cloudflare untuk publik (belum diverifikasi penuh lintas OS).
      cert_mode: selfsigned
      acme_enabled: false

      ssh_admin_port: 22
      ssh_admin_extra_ports: []
      openssh_admin_change_access: false

      # prepare-server.yml memasang timer rollback nyata sebelum firewall.
      # Backup dinonaktifkan sampai public recipient age dikonfigurasi.
      backup_enabled: false
      backup_age_recipient: ''
      backup_age_identity: "{{ vault_backup_age_identity | default('') }}"

      # Hanya untuk server bersih, bukan server yang sudah mempunyai akun.
      tunnelctl_enabled: true
      tunnelctl_integration_approved: true
      tunnelctl_fresh_install: true
      tunnelctl_accounts_imported: false
      tunnelctl_backup_integration_approved: true

      # Nyalakan hanya jika tunnelctl_enabled=true.
      tunnelctl_settings:
        domain: gw.example.com
        cert_mode: selfsigned
        timezone: Asia/Jakarta
        db_path: /var/lib/tunnel/tunnel.db
        lock_path: /run/tunnel/tunnel.lock
        settings_path: /etc/tunnel/settings.json
        xray_base_path: /etc/tunnel/xray/base.json
        xray_config_path: /etc/tunnel/xray/config.json
        xray_validate_cmd: [/usr/local/bin/xray, run, '-test', '-config']
        xray_api: 127.0.0.1:10085
        ssh_admin_port: 22
        extra_http_ports: []
        doctor_services: [haproxy, xray, ws-epro, dropbear-tunnel, nginx, chrony, tunnel-firewall, vnstat]
        doctor_internal_ports: [143, 10015, 8080, 10010, 7300]
        doctor_required_checks: [services, db, ports, cert, time, configs]
        backup_dir: /var/backups/tunnel
        backup_keep: 7
        backup_age_recipients_file: /etc/tunnel/backup-age-recipients
        backup_age_identity: /etc/tunnel/backup-age-identity
        backup_include_certs: false
        ss_method: chacha20-ietf-poly1305
        banner_path: /etc/tunnel/banner.txt
        wsepro_config_path: /etc/tunnel/ws-epro.conf
        cert_renew_cmd: [openssl, x509, '-checkend', '86400', '-noout', '-in', /etc/haproxy/certs/gw.example.com.pem]
