---
# Tahap 1: pasang semua paket OS sebelum service dikonfigurasi.
#   package_version_mode=pinned            (default) pasang versi dari repo OS, TIDAK meng-upgrade paket yang
#                                          sudah ada; laporkan selisih terhadap versi teruji di manifest.
#   package_version_mode=latest-compatible pasang/upgrade semua paket gateway ke versi terbaru repo OS.
# Manifest = versi yang pernah diuji. Repo OS hanya menyimpan versi terbaru (pembaruan keamanan),
# jadi selisih versi adalah peringatan, bukan kegagalan.
- name: Prepare gateway packages
  hosts: all
  become: true
  gather_facts: true

  vars_files:
    - vars/gateway-packages.yml

  vars:
    gateway_package_mode: "{{ package_version_mode | default('pinned') }}"
    gateway_no_autostart: [haproxy, nginx, dropbear, fail2ban]

  tasks:
    - name: Validate package version mode
      ansible.builtin.assert:
        that:
          - gateway_package_mode in ['pinned', 'latest-compatible']
        fail_msg: "package_version_mode harus pinned atau latest-compatible."
        quiet: true

    - name: Require supported operating system
      ansible.builtin.assert:
        that:
          - >-
            (ansible_facts.distribution == 'Debian'
             and ansible_facts.distribution_major_version in ['12', '13'])
            or
            (ansible_facts.distribution == 'Ubuntu'
             and ansible_facts.distribution_version in ['22.04', '24.04', '26.04'])
          - ansible_facts.architecture in ['x86_64', 'aarch64']
        fail_msg: Hanya Debian 12/13 dan Ubuntu 22.04/24.04/26.04 pada amd64/arm64.
        quiet: true

    - name: Normalize OS version for package manifest
      ansible.builtin.set_fact:
        gateway_os_version: >-
          {{ ansible_facts.distribution_major_version if ansible_facts.distribution == 'Debian'
             else ansible_facts.distribution_version }}

    # apt-get exits 0 when only a third-party repository (e.g. Ookla) is unreachable; real errors exit 100.
    - name: Refresh APT package lists before auditing candidates
      ansible.builtin.command:
        argv: [apt-get, update, -q]
      register: gateway_apt_update
      changed_when: false
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Warn about unreachable repositories (installation continues with the OS repositories)
      ansible.builtin.debug:
        msg: "{{ (gateway_apt_update.stdout_lines + gateway_apt_update.stderr_lines) | select('match', '^(W|Err):') | list }}"
      when: "'Failed to fetch' in (gateway_apt_update.stdout ~ gateway_apt_update.stderr)"

    - name: Load tested package manifest for this OS
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/package-versions/{{ ansible_facts.distribution | lower }}-{{ gateway_os_version }}.yml"
        name: gateway_package_manifest

    - name: Validate manifest identity and completeness
      ansible.builtin.assert:
        that:
          - gateway_package_manifest.os == (ansible_facts.distribution | lower)
          - gateway_package_manifest.version == gateway_os_version
          - gateway_packages | difference(gateway_package_manifest.packages.keys() | list) | length == 0
        fail_msg: Manifest versi paket tidak cocok dengan OS atau tidak memuat semua paket.
        quiet: true

    - name: Check APT package candidates
      ansible.builtin.command:
        argv: [apt-cache, policy, "{{ item }}"]
      loop: "{{ gateway_packages }}"
      register: package_audit
      changed_when: false

    - name: Collect candidate versions
      ansible.builtin.set_fact:
        gateway_candidates: >-
          {{ gateway_candidates | default({}) | combine({item.item:
             (item.stdout | regex_findall('(?m)^\s*Candidate:\s*(\S+)\s*$') | first | default('(none)'))}) }}
      loop: "{{ package_audit.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Require every package to be available in the OS repositories
      ansible.builtin.assert:
        that:
          - gateway_candidates | dict2items | selectattr('value', 'equalto', '(none)') | list | length == 0
        fail_msg: >-
          Paket tidak tersedia di repo OS:
          {{ gateway_candidates | dict2items | selectattr('value', 'equalto', '(none)') | map(attribute='key') | join(', ') }}.
          Aktifkan repo main/universe (Ubuntu) atau main (Debian) lalu ulangi.

    - name: Require HAProxy 2.4 or newer
      ansible.builtin.assert:
        that:
          - (gateway_candidates['haproxy'] | regex_replace('^[0-9]+:', '') | regex_search('^[0-9]+[.][0-9]+')) is version('2.4', '>=')
        fail_msg: "HAProxy {{ gateway_candidates['haproxy'] }} terlalu lama; minimal 2.4."
        quiet: true

    - name: Compare repository versions with tested versions
      ansible.builtin.set_fact:
        gateway_version_diffs: >-
          {{ gateway_version_diffs | default([])
             + [item.key ~ ': teruji ' ~ gateway_package_manifest.packages[item.key] ~ ' -> repo ' ~ item.value] }}
      loop: "{{ gateway_candidates | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.value != gateway_package_manifest.packages[item.key]

    - name: Report version differences (security updates are expected; not an error)
      ansible.builtin.debug:
        msg: "{{ gateway_version_diffs | default(['Semua paket sama dengan versi teruji.']) }}"

    - name: Read which no-autostart services were already installed
      ansible.builtin.command:
        argv: [dpkg-query, -W, '-f=${Status}', "{{ item }}"]
      loop: "{{ gateway_no_autostart }}"
      register: gateway_preinstalled
      changed_when: false
      failed_when: false

    - name: Install gateway packages without starting services
      ansible.builtin.apt:
        name: "{{ gateway_packages }}"
        state: "{{ 'latest' if gateway_package_mode == 'latest-compatible' else 'present' }}"
        policy_rc_d: 101
        fail_on_autoremove: true

    - name: Read managed configuration markers
      ansible.builtin.command:
        argv: [grep, -qs, 'Managed by Ansible', "{{ item }}"]
      loop: [/etc/nginx/nginx.conf, /etc/haproxy/haproxy.cfg]
      register: gateway_managed_configs
      changed_when: false
      failed_when: false

    # policy-rc.d only prevents starting; the units stay enabled and would start with distro defaults on
    # reboot (nginx default site on :80, Debian dropbear on :22). site.yml enables them with managed config.
    - name: Keep distro Dropbear listener disabled (gateway uses dropbear-tunnel)
      ansible.builtin.systemd:
        name: dropbear
        enabled: false
        state: stopped
      failed_when: false

    - name: Keep newly installed unmanaged services disabled until site.yml configures them
      ansible.builtin.systemd:
        name: "{{ item.item }}"
        enabled: false
      loop: "{{ gateway_preinstalled.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.item in ['nginx', 'haproxy', 'fail2ban']
        - item.stdout != 'install ok installed'
        - >-
          item.item == 'fail2ban' or
          (gateway_managed_configs.results
           | selectattr('item', 'search', item.item) | map(attribute='rc') | first | default(1)) != 0
      failed_when: false

    - name: Show package preparation summary
      ansible.builtin.debug:
        msg: >-
          {{ gateway_packages | length }} paket siap (mode {{ gateway_package_mode }}).
          HAProxy {{ gateway_candidates['haproxy'] }}, Nginx {{ gateway_candidates['nginx'] }},
          Dropbear {{ gateway_candidates['dropbear'] }}.
