---
# Optional Ookla Speedtest CLI. Ookla's packagecloud repository only publishes up to Ubuntu jammy,
# so every supported OS uses the ubuntu/jammy repository (the package is a static binary).
# Never fails the deployment: on any error the repository file is removed so apt keeps working.
- name: Optional Ookla Speedtest CLI
  hosts: all
  become: true
  gather_facts: false

  vars:
    speedtest_key_url: https://packagecloud.io/ookla/speedtest-cli/gpgkey
    speedtest_key_fingerprint: C525F88FCF3A7E56CE2CF59131EB3981E723ACAA
    speedtest_key_path: /etc/apt/keyrings/ookla-speedtest.asc
    speedtest_list_path: /etc/apt/sources.list.d/ookla-speedtest.list
    speedtest_repo_line: >-
      deb [signed-by={{ speedtest_key_path }}] https://packagecloud.io/ookla/speedtest-cli/ubuntu/ jammy main

  tasks:
    - name: Skip when Speedtest is disabled
      ansible.builtin.meta: end_host
      when: not (speedtest_enabled | default(true) | bool)

    - name: Install and verify Ookla repository and package
      block:
        - name: Create APT keyring directory
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Download Ookla repository signing key
          ansible.builtin.get_url:
            url: '{{ speedtest_key_url }}'
            dest: '{{ speedtest_key_path }}'
            owner: root
            group: root
            mode: '0644'
            timeout: 20

        - name: Inspect downloaded signing key
          ansible.builtin.command:
            argv: [gpg, --batch, --no-default-keyring, --show-keys, --with-colons, '{{ speedtest_key_path }}']
          register: speedtest_key_info
          changed_when: false

        - name: Require the known Ookla packagecloud fingerprint
          ansible.builtin.assert:
            that:
              - speedtest_key_fingerprint in speedtest_key_info.stdout
            fail_msg: Fingerprint kunci Ookla tidak cocok; repositori tidak dipasang.
            quiet: true

        - name: Configure Ookla repository (forced ubuntu/jammy)
          ansible.builtin.copy:
            dest: '{{ speedtest_list_path }}'
            content: "# Managed by Ansible (tunnel-gateway): Ookla Speedtest CLI\n{{ speedtest_repo_line }}\n"
            owner: root
            group: root
            mode: '0644'

        - name: Refresh APT lists
          ansible.builtin.command:
            argv: [apt-get, update, -q]
          changed_when: false

        - name: Require the speedtest package from the Ookla repository
          ansible.builtin.command:
            argv: [apt-cache, policy, speedtest]
          register: speedtest_candidate
          changed_when: false
          failed_when: >-
            'packagecloud.io/ookla/speedtest-cli' not in speedtest_candidate.stdout
            or 'Candidate: (none)' in speedtest_candidate.stdout

        - name: Install Ookla Speedtest CLI
          ansible.builtin.apt:
            name: speedtest
            state: present

        - name: Report Speedtest installed
          ansible.builtin.debug:
            msg: Speedtest Ookla terpasang (Menu Sistem > 13).

      rescue:
        - name: Remove Ookla repository so APT stays healthy
          ansible.builtin.file:
            path: '{{ speedtest_list_path }}'
            state: absent

        - name: Refresh APT lists without the Ookla repository
          ansible.builtin.command:
            argv: [apt-get, update, -q]
          changed_when: false
          failed_when: false

        - name: Report Speedtest skipped (deployment continues)
          ansible.builtin.debug:
            msg: >-
              Speedtest dilewati: {{ ansible_failed_result.msg | default('repositori Ookla tidak tersedia') }}.
              Instalasi gateway tetap berjalan; coba lagi nanti dengan
              ansible-playbook playbooks/prepare-speedtest.yml
